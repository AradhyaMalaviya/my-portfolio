<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-YZMTR0MF3R"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-YZMTR0MF3R');
    </script>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found</title>

    <link rel="shortcut icon" href="./assets/images/letter-a.svg" type="image/x-icon" />
    <link rel="stylesheet" href="./assets/css/style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
    
    <style>
      .error-page {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        background-color: var(--smoky-black);
        color: var(--white-1);
        padding: 20px;
      }
      .error-title {
        font-size: 6rem;
        margin-bottom: 10px;
        background: var(--text-gradient-yellow);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .error-desc {
        font-size: 1.5rem;
        margin-bottom: 30px;
        color: var(--light-gray);
      }
      .back-btn {
        background: var(--bg-gradient-yellow-1);
        color: var(--smoky-black);
        padding: 15px 30px;
        border-radius: 14px;
        font-weight: 500;
        text-decoration: none;
        transition: var(--transition-1);
      }
      .back-btn:hover {
        background: var(--bg-gradient-yellow-2);
        color: var(--white-1);
      }
    </style>
  </head>

  <body>
    <div class="error-page">
      <h1 class="error-title">404</h1>
      <p class="error-desc">Oops! The page you are looking for does not exist.</p>
      <a href="/" class="back-btn">Go Back Home</a>
    </div>
  </body>
</html>
